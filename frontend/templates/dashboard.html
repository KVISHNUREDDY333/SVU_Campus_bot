<section
          id="dashboard-section"
          class="content-section hidden"
        >
          <div class="header dashboard-header">
            <div class="flex-center-gap-15">
              <div class="mobile-menu-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></div>
              <h3 class="m-0">Analytics Dashboard</h3>
            </div>
            <button class="btn-primary ml-auto dashboard-refresh-btn" onclick="loadDashboard()">
              <i class="fa-solid fa-arrows-rotate"></i> Refresh
            </button>
          </div>
          <div class="admin-content">
            <div class="stats-grid">
              <div class="stat-card">
                <div class="stat-icon query-icon">
                  <i class="fa-solid fa-comments"></i>
                </div>
                <div class="stat-info">
                  <h3>Total Queries</h3>
                  <p id="total-queries">Loading...</p>
                </div>
              </div>
              <div class="stat-card">
                <div class="stat-icon user-icon">
                  <i class="fa-solid fa-users"></i>
                </div>
                <div class="stat-info">
                  <h3>Active Users</h3>
                  <p id="active-users">Loading...</p>
                  <div class="text-xs text-success mt-4">
                    <i class="fa-solid fa-arrow-up"></i> 5 new today
                  </div>
                </div>
              </div>
              <div class="stat-card">
                <div class="stat-icon doc-icon">
                  <i class="fa-solid fa-database"></i>
                </div>
                <div class="stat-info">
                  <h3>Documents</h3>
                  <p id="total-documents">...</p>
                  <div class="text-xs text-success mt-4">
                    <i class="fa-solid fa-check-circle"></i> Live Data
                  </div>
                </div>
              </div>
              <div class="suggestions-grid" id="trending-queries-container">
                
              </div>
            </div>
            <div class="dashboard-grid dashboard-grid-main">
              <div class="chart-container">
                <canvas id="roleChart"></canvas>
              </div>
              <div class="chart-container">
                <div class="chart-header chart-header-flex">
                  <h4 class="m-0 text-sm text-primary">
                    User Sentiment Analysis
                  </h4>
                  <button
                    class="speech-btn icon-small"
                    onclick="loadDashboard()"
                    title="Refresh Analytics"
                  >
                    <i class="fa-solid fa-rotate"></i>
                  </button>
                </div>
                <canvas id="sentimentChart"></canvas>
              </div>
            </div>

            <div class="settings-card mt-32">
              <div class="card-header">
                <div class="card-icon modal-header-purple">
                  <i class="fa-solid fa-book-open"></i>
                </div>
                <h4>Knowledge Base</h4>
                <button
                  class="btn-primary ml-auto text-sm py-8 px-16"
                  onclick="showSection('admin')"
                >
                  <i class="fa-solid fa-gears"></i> Manage All Data
                </button>
              </div>
              <p class="text-secondary mb-20">
                View your documents in knowledge base
              </p>
            </div>
          </div>
        </section>
