<section id="dashboard-section" class="content-section" style="display: none">
  <div class="header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
    <div>
      <h2 style="margin: 0; font-size: 24px; font-weight: 700;">Analytics Dashboard</h2>
      <p style="color: var(--text-secondary); margin: 4px 0 0 0;">Real-time insights and system performance</p>
    </div>
    <button class="btn-primary" onclick="refreshDashBoard()" style="padding: 10px 20px; font-size: 14px; display: flex; align-items: center; gap: 8px;">
      <i class="fa-solid fa-rotate"></i> Refresh Data
    </button>
  </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon query-icon">
                <i class="fa-solid fa-comments"></i>
            </div>
            <div class="stat-info">
                <h3>Total Queries</h3>
                <p id="total-queries">0</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon user-icon">
                <i class="fa-solid fa-users"></i>
            </div>
            <div class="stat-info">
                <h3>Active Users</h3>
                <p id="active-users">0</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon doc-icon">
                <i class="fa-solid fa-file-lines"></i>
            </div>
            <div class="stat-info">
                <h3>Knowledge Base</h3>
                <p id="kb-count">0 Docs</p>
            </div>
        </div>
    </div>

    <div class="dashboard-grid" style="display: grid; grid-template-columns: 2fr 1fr; gap: 24px; margin-top: 24px;">
        <div class="settings-card">
            <div class="card-header">
                <div class="card-icon" style="background: var(--gradient-primary);">
                    <i class="fa-solid fa-chart-area"></i>
                </div>
                <h4>Query Distribution</h4>
            </div>
            <div class="card-body" style="padding: 24px;">
                <canvas id="queryChart" style="max-height: 400px; width: 100%;"></canvas>
            </div>
        </div>

        <div class="settings-card">
            <div class="card-header">
                <div class="card-icon" style="background: var(--gradient-primary);">
                    <i class="fa-solid fa-list-ul"></i>
                </div>
                <h4>Top Categories</h4>
            </div>
            <div class="card-body" style="padding: 24px;">
                <canvas id="categoryChart" style="max-height: 400px; width: 100%;"></canvas>
            </div>
        </div>
    </div>

  <div class="settings-card" style="margin-top: 24px;">
    <div class="card-header"><h4>System Notifications</h4></div>
    <div id="dashboard-notifications-list" style="max-height: 300px; overflow-y: auto;">
      <!-- Notifications will be loaded here -->
    </div>
  </div>
</section>
