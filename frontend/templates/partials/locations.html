<section id="locations-section" class="content-section" style="display: none">
  <div class="header">
    <h3 class="header-title">University Map & Locations</h3>
    <div class="header-actions">
      <button class="btn-primary" onclick="fetchLocations()" title="Refresh Locations">
        <i class="fa-solid fa-rotate"></i> Refresh
      </button>
    </div>
  </div>

  <div class="map-layout" style="display: grid; grid-template-columns: 1fr 320px; gap: 24px; margin-top: 24px; min-height: 600px;">
    <!-- Map Content -->
    <div class="map-area" style="display: flex; flex-direction: column; gap: 24px;">
      <div class="settings-card" style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.03); border: 2px dashed var(--border-color); min-height: 400px;">
        <i class="fa-solid fa-map-location-dot" style="font-size: 64px; color: var(--text-muted); margin-bottom: 24px;"></i>
        <h4 style="color: var(--text-primary);">Interactive Map Station</h4>
        <p style="color: var(--text-muted);">SVU Campus Maps Integration Placeholder</p>
      </div>
      
      <div id="location-details-card" class="settings-card" style="display: none; height: auto;">
        <!-- Location details show here when clicked -->
      </div>
    </div>

    <!-- Location list -->
    <div class="location-sidebar">
      <div class="settings-card" style="height: 100%; display: flex; flex-direction: column;">
        <div class="card-header" style="border-bottom: 1px solid var(--border-color); padding: 16px;">
          <input type="text" id="location-search" placeholder="Search buildings, hostels..." oninput="filterLocations()" title="Search locations" style="width: 100%; margin: 0;">
        </div>
        <div class="card-body" style="overflow-y: auto; flex: 1; padding: 16px;">
          <div id="location-list" style="display: flex; flex-direction: column; gap: 12px;">
            <!-- Locations will be listed here -->
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
