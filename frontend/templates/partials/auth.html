<!-- Auth Overlay (This handles Login and Registration within the SPA) -->
<div id="auth-main-overlay" class="auth-page-overlay" style="display: none">
  <div class="auth-card">
    <div class="auth-header">
      <img src="/static/images/svu_logo_final_v2.jpg" alt="SVU Logo" style="width: 60px; height: 60px; border-radius: 12px; margin-bottom: 24px;">
      <h2 id="auth-title">Welcome Back</h2>
      <p id="auth-subtitle">Login to your SVU CampusConnect account</p>
    </div>
    
    <div class="auth-tabs" style="display: flex; margin-bottom: 24px; border-bottom: 1px solid var(--border-color);">
        <button id="tab-login" class="auth-tab active" onclick="switchAuthTab('login')" title="Login Tab">Login</button>
        <button id="tab-register" class="auth-tab" onclick="switchAuthTab('register')" title="Register Tab">Register</button>
    </div>
 
    <form id="auth-form" onsubmit="handleAuth(event)">
      <div id="auth-fields" class="form-group">
        <!-- Fields injected by JS (login vs register) -->
      </div>
      <button type="submit" id="auth-submit-btn" class="btn-primary" style="width: 100%; padding: 16px; font-weight: 700; font-size: 16px; margin-top: 16px;" title="Authenticate">
          Login to Account
      </button>
    </form>
  </div>
</div>
