<section id="calendar-section" class="content-section" style="display: none">
  <div class="header">
    <h3 class="header-title">Academic Calendar</h3>
    <div class="header-actions">
      <button class="btn-primary" onclick="loadAcademicCalendar()" title="Refresh Calendar">
        <i class="fa-solid fa-rotate"></i> Refresh
      </button>
    </div>
  </div>

  <div class="calendar-layout" style="display: grid; grid-template-columns: 320px 1fr; gap: 24px; align-items: start; margin-top: 24px;">
    <!-- Filter Sidebar -->
    <div class="settings-card" style="position: sticky; top: 24px;">
      <div class="card-header">
        <h4>Filter Events</h4>
      </div>
      <div class="card-body" style="padding: 24px;">
        <div class="form-group">
          <label>Search Events</label>
          <input type="text" id="calendar-search" placeholder="Search events..." oninput="filterCalendar()" title="Search filter">
        </div>
        <div class="form-group" style="margin-top: 24px;">
          <label>Categories</label>
          <div class="checkbox-group" style="display: flex; flex-direction: column; gap: 12px; margin-top: 12px;">
            <label class="custom-checkbox">
              <input type="checkbox" checked onchange="filterCalendar()" value="Exams">
              <span>Exams</span>
            </label>
            <label class="custom-checkbox">
              <input type="checkbox" checked onchange="filterCalendar()" value="Holidays">
              <span>Holidays</span>
            </label>
            <label class="custom-checkbox">
              <input type="checkbox" checked onchange="filterCalendar()" value="Academic">
              <span>Academic</span>
            </label>
            <label class="custom-checkbox">
              <input type="checkbox" checked onchange="filterCalendar()" value="Events">
              <span>Events</span>
            </label>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Calendar Display -->
    <div class="calendar-list-view">
      <div id="calendar-container" class="grid-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;">
        <!-- Calendar items will load here -->
      </div>
    </div>
  </div>
</section>
