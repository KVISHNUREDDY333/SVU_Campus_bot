<section
          id="career-section"
          class="content-section hidden"
        >
  <div class="header">
    <div class="flex-center-gap-15">
      <div class="mobile-menu-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></div>
      <h3 class="m-0">Career & Placement Hub</h3>
    </div>
  </div>
  <div class="career-container p-24 m-auto">
    <!-- Career Tabs -->
    <div class="auth-tabs mb-20 justify-start">
              <button
                id="tab-resume-checker"
                class="auth-tab active"
                onclick="switchCareerTab('checker')"
              >
                Resume Checker
              </button>
              <button
                id="tab-resume-maker"
                class="auth-tab"
                onclick="switchCareerTab('maker')"
              >
                Resume Maker
              </button>
            </div>

            <!-- Resume Checker View -->
            <div id="resume-checker-view" class="settings-card">
              <div class="card-header">
                <div class="card-icon modal-header-indigo">
                  <i class="fa-solid fa-file-invoice"></i>
                </div>
                <h4>AI Resume Checker</h4>
              </div>
      <div class="form-group mb-15">
        <label class="form-label-flex text-secondary text-sm">Target Job Role (Optional)</label>
        <input
          type="text"
          id="resume-target-role"
          placeholder="e.g., Software Engineer, Data Analyst..."
          class="form-input-p12"
        />
      </div>
      <div class="mode-toggle-container mb-20">
        <button id="mode-text-btn" class="auth-tab active px-20 py-8 rounded-12" onclick="setCheckerMode('text')">
          <i class="fa-solid fa-align-left mr-8"></i> Paste Text
        </button>
        <button id="mode-pdf-btn" class="auth-tab px-20 py-8 rounded-12" onclick="setCheckerMode('pdf')">
          <i class="fa-solid fa-file-pdf mr-8"></i> Upload PDF
        </button>
      </div>

      <div id="checker-text-area">
        <p class="text-secondary text-sm my-10">
          Paste your resume text below for instant feedback based on SVU guidelines and industry standards.
        </p>
        <textarea
          id="resume-text-input"
          rows="12"
          placeholder="Paste resume content here..."
          class="form-input-p15 mb-15"
        ></textarea>
      </div>

      <div id="checker-pdf-area" class="hidden">
        <div class="file-upload-zone p-30 border-dashed border-standard rounded-20 text-center mb-15 bg-ghost hover-accent transition-all cursor-pointer" onclick="document.getElementById('resume-file-input').click()">
          <i class="fa-solid fa-cloud-arrow-up text-4xl text-accent mb-15 opacity-70"></i>
          <p class="text-secondary mb-10">Select your Resume PDF (Max 5MB)</p>
          <button class="btn-secondary btn-small">Browse PDF</button>
          <input type="file" id="resume-file-input" accept=".pdf" class="hidden" onchange="handleResumeFileChange(this)" title="Upload Resume PDF" />
        </div>
        <div id="selected-file-name" class="text-accent text-sm font-medium mb-15 hidden"></div>
      </div>
      <button
        class="btn-primary w-full"
        onclick="checkResume()"
      >
        <i class="fa-solid fa-microscope"></i> Analyze Resume
      </button>
      <div id="resume-feedback" class="mt-20 text-md leading-relaxed text-primary"></div>
    </div>

            <!-- Resume Maker View -->
            <div
              id="resume-maker-view"
              class="settings-card hidden"
            >
              <div class="card-header">
                <div
                  class="card-icon modal-header-primary"
                >
                  <i class="fa-solid fa-pen-nib"></i>
                </div>
                <h4>AI Resume Maker</h4>
              </div>
              <p class="text-secondary text-sm mb-20">
                Fill in the details to generate a professional, ATS-friendly
                resume prototype.
              </p>

              <div class="grid-2">
                <div class="form-group">
                  <label>Full Name</label>
                  <input
                    type="text"
                    id="maker-fullname"
                    class="search-input"
                    placeholder="John Doe"
                  />
                </div>
                <div class="form-group">
                  <label>Email</label>
                  <input
                    type="email"
                    id="maker-email"
                    class="search-input"
                    placeholder="john@example.com"
                  />
                </div>
                <div class="form-group">
                  <label>Phone Number</label>
                  <input
                    type="text"
                    id="maker-phone"
                    class="search-input"
                    placeholder="+91 98765 43210"
                  />
                </div>
                <div class="form-group">
                  <label>LinkedIn URL</label>
                  <input
                    type="text"
                    id="maker-linkedin"
                    class="search-input"
                    placeholder="linkedin.com/in/johndoe"
                  />
                </div>
              </div>

              <div class="grid-2-1 mt-15">
                <div class="form-group">
                  <label>Highest Qualification</label>
                  <input
                    type="text"
                    id="maker-qualification"
                    class="search-input"
                    placeholder="B.Tech Computer Science"
                  />
                </div>
                <div class="form-group">
                  <label>Percentage / CGPA</label>
                  <input
                    type="text"
                    id="maker-percentage"
                    class="search-input"
                    placeholder="8.5 CGPA"
                  />
                </div>
              </div>

              <div class="form-group mt-15">
                <label>Target Job Role</label>
                <input
                  type="text"
                  id="maker-role"
                  class="search-input"
                  placeholder="e.g., Software Engineer, Data Scientist"
                />
              </div>

              <div class="form-group mt-15">
                <label>Experience Level</label>
                <select
                  id="maker-level"
                  class="custom-select w-full p-12 rounded-12"
                  title="Select Experience Level"
                >
                  <option value="Beginner">Beginner (Student / Fresher)</option>
                  <option value="Intermediate">Intermediate (1-3 years)</option>
                  <option value="Professional">Professional (3+ years)</option>
                </select>
              </div>

              <div class="form-group mt-15">
                <label>Technical Skills (Comma separated)</label>
                <input
                  type="text"
                  id="maker-skills-tech"
                  class="search-input"
                  placeholder="React, Node.js, Python, SQL, MongoDB"
                />
              </div>

              <div class="form-group mt-15">
                <label>Coding Skills (Comma separated)</label>
                <input
                  type="text"
                  id="maker-skills-coding"
                  class="search-input"
                  placeholder="Java, C++, Python, JavaScript"
                />
              </div>

              <div class="form-group mt-15">
                <label>Soft Skills</label>
                <input
                  type="text"
                  id="maker-skills-soft"
                  class="search-input"
                  placeholder="Communication, Leadership, Problem Solving"
                />
              </div>

              <div class="form-group mt-15">
                <label>Research Papers / Publications (Optional)</label>
                <textarea
                  id="maker-research"
                  class="search-input"
                  rows="3"
                  placeholder="List any papers or publications..."
                ></textarea>
              </div>

              <div class="form-group mt-15">
                <label>Industry / Internship Experience (Optional)</label>
                <textarea
                  id="maker-experience"
                  class="search-input"
                  rows="4"
                  placeholder="Briefly describe your experience..."
                ></textarea>
              </div>

              <div class="form-group mt-15">
                <label>Projects (Academic / Personal) (Optional)</label>
                <textarea
                  id="maker-projects"
                  class="search-input"
                  rows="4"
                  placeholder="Describe your key projects, roles, and outcomes..."
                ></textarea>
              </div>

              <button
                class="btn-primary w-full mt-20"
                onclick="generateResume()"
              >
                <i class="fa-solid fa-wand-magic-sparkles"></i> Generate Resume
                Prototype
              </button>

              <div
                id="resume-generation-feedback"
                class="mt-20 text-md leading-relaxed text-primary bg-secondary p-20 rounded-12 hidden"
              ></div>
            </div>
          </div>
        </section>
