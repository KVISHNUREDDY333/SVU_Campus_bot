<section id="chat-section" class="content-section">
          
          <div class="header">
            <div class="flex-center-gap-15">
              <div class="mobile-menu-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></div>
              <h3 class="m-0">Campus Assistant</h3>
            </div>

            <div
              class="header-actions flex items-center gap-16 text-secondary"
            >
              <div class="notification-wrapper">
                  <i
                    class="fa-solid fa-bell clickable text-lg"
                    id="notification-bell"
                    title="Notifications"
                    onclick="toggleNotifications()"
                  ></i>
                <span id="notification-badge" class="notification-badge hidden">0</span>
                <div id="notification-dropdown" class="notification-dropdown hidden">
                  <div class="notification-header">
                    <h4>Notifications</h4>
                    <div class="notif-header-actions">
                      <span class="mark-all-read" onclick="markAllNotificationsAsRead()">Mark all read</span>
                      <span class="clear-all-notif" onclick="clearAllNotifications()">Clear all</span>
                    </div>
                  </div>
                  <div id="notification-items" class="notification-items">
                    
                    <div class="no-notifications">No new notifications</div>
                  </div>
                </div>
              </div>
              <i
                class="fa-solid fa-moon clickable text-lg"
                id="header-theme-icon"
                title="Toggle Theme"
                onclick="toggleTheme()"
              ></i>
              <a
                href="https://svuniversity.edu.in/"
                target="_blank"
                rel="noopener"
                title="Official Website"
                class="header-globe-link"
              >
                <i class="fa-solid fa-globe text-lg"></i>
              </a>
              <i
                class="fa-solid fa-lightbulb clickable text-lg"
                title="Suggest FAQ"
                onclick="openSuggestModal()"
              ></i>
              <button
                onclick="clearChat()"
                class="btn-new-chat"
              >
                New Chat
              </button>
              <i
                class="fa-solid fa-rotate-right clickable text-lg"
                title="Refresh"
                onclick="window.location.reload()"
              ></i>
            </div>
          </div>

          <div class="chat-area" id="chat-box">
            
            <div id="welcome-screen" class="welcome-screen">
              <div class="welcome-badge">SVU OFFICIAL ASSISTANT</div>
              <img
                src="/static/images/svu_logo_final_v2.jpg"
                class="welcome-logo"
                alt="Logo"
              />
              <div class="welcome-text">
                <h1>How can I assist you today?</h1>
                <p>
                  Get instant answers about courses, admissions, campus
                  facilities, and student life at Sri Venkateswara University.
                </p>
              </div>
              <div class="suggestions-grid" id="trending-queries-container">
                
              </div>
            </div>

            <div
              id="typing-indicator"
              class="typing-indicator hidden"
            >
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
            </div>
          </div>

          <div class="input-area-wrapper">
            <div class="input-container">
              
              <input
                type="text"
                class="hidden invisible-trap"
                tabindex="-1"
                title="Autofill trap"
              />
              <input
                type="password"
                class="hidden invisible-trap"
                tabindex="-1"
                title="Autofill trap"
              />

              <input
                type="text"
                id="user-input"
                placeholder="Ask anything... (Type or Speak)"
                autocomplete="off"
                name="chat-input-field"
                title="Ask anything to the campus assistant"
              />
              <select
                id="lang-select"
                class="lang-select"
                title="Select Input/Output Language"
              >
                <option value="en">English</option>
                <option value="te">Telugu</option>
                <option value="hi">Hindi</option>
              </select>

              <!-- Premium Custom Language Selector -->
              <div class="custom-lang-selector" id="custom-lang-selector">
                <button class="custom-lang-btn" id="custom-lang-btn" type="button" aria-haspopup="listbox" aria-expanded="false" title="Change Language">
                  <i class="fa-solid fa-globe lang-globe-icon"></i>
                  <span id="current-lang-label">English</span>
                  <i class="fa-solid fa-chevron-down lang-chevron-icon"></i>
                </button>
                <div class="custom-lang-dropdown" id="custom-lang-dropdown" role="listbox" aria-label="Language options" title="Language options">
                  <div class="custom-lang-option active" data-value="en" role="option" aria-selected="true">
                    <span class="lang-name">English</span>
                    <i class="fa-solid fa-check check-icon"></i>
                  </div>
                  <div class="custom-lang-option" data-value="te" role="option" aria-selected="false">
                    <span class="lang-name">తెలుగు</span>
                    <i class="fa-solid fa-check check-icon"></i>
                  </div>
                  <div class="custom-lang-option" data-value="hi" role="option" aria-selected="false">
                    <span class="lang-name">हिन्दी</span>
                    <i class="fa-solid fa-check check-icon"></i>
                  </div>
                </div>
              </div>
              <button
                id="mic-btn"
                class="mic-btn"
                onclick="toggleVoiceInput()"
                title="Voice input"
              >
                <i class="fa-solid fa-microphone"></i>
              </button>
              <button
                id="send-btn"
                class="send-btn"
                onclick="sendMessage()"
                title="Send message"
              >
                <i class="fa-solid fa-arrow-up"></i>
              </button>
            </div>
          </div>
        </section>
