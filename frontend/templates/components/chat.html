<section id="chat-section" class="content-section">
          <!-- Header -->
          <div class="header">
            <div style="display: flex; align-items: center; gap: 15px;">
              <div class="mobile-menu-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></div>
              <h3 style="margin: 0;">Campus Assistant</h3>
            </div>

            <div
              class="header-actions"
              style="
                display: flex;
                gap: 16px;
                color: var(--text-secondary);
                align-items: center;
              "
            >
              <div class="notification-wrapper">
                <i
                  class="fa-solid fa-bell"
                  id="notification-bell"
                  title="Notifications"
                  onclick="toggleNotifications()"
                  style="cursor: pointer; font-size: 18px"
                ></i>
                <span id="notification-badge" class="notification-badge" style="display: none">0</span>
                <div id="notification-dropdown" class="notification-dropdown" style="display: none">
                  <div class="notification-header">
                    <h4>Notifications</h4>
                    <div class="notif-header-actions">
                      <span class="mark-all-read" onclick="markAllNotificationsAsRead()">Mark all read</span>
                      <span class="clear-all-notif" onclick="clearAllNotifications()">Clear all</span>
                    </div>
                  </div>
                  <div id="notification-items" class="notification-items">
                    <!-- Notifications will be loaded here -->
                    <div class="no-notifications">No new notifications</div>
                  </div>
                </div>
              </div>
              <i
                class="fa-solid fa-moon"
                id="header-theme-icon"
                title="Toggle Theme"
                onclick="toggleTheme()"
                style="cursor: pointer; font-size: 18px"
              ></i>
              <a
                href="https://svuniversity.edu.in/"
                target="_blank"
                rel="noopener"
                title="Official Website"
                style="color: var(--text-secondary); text-decoration: none; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 12px; transition: all 0.2s;"
                onmouseover="this.style.background='rgba(0,0,0,0.05)'; this.style.color='var(--accent-color)'"
                onmouseout="this.style.background='none'; this.style.color='var(--text-secondary)'"
              >
                <i class="fa-solid fa-globe" style="font-size: 18px"></i>
              </a>
              <i
                class="fa-solid fa-lightbulb"
                title="Suggest FAQ"
                onclick="openSuggestModal()"
                style="cursor: pointer; font-size: 18px"
              ></i>
              <button
                onclick="clearChat()"
                style="
                  background: none;
                  border: none;
                  font-size: 0.9rem;
                  color: var(--text-secondary);
                  cursor: pointer;
                  margin-right: 8px;
                  font-weight: 500;
                "
              >
                New Chat
              </button>
              <i
                class="fa-solid fa-rotate-right"
                title="Refresh"
                onclick="window.location.reload()"
                style="cursor: pointer; font-size: 18px"
              ></i>
            </div>
          </div>

          <!-- Chat Area -->
          <div class="chat-area" id="chat-box">
            <!-- Welcome Screen (Initial State) -->
            <div id="welcome-screen" class="welcome-screen">
              <div class="welcome-badge">SVU OFFICIAL ASSISTANT</div>
              <img
                src="/static/images/svu_logo_final_v2.jpg"
                class="welcome-logo"
                alt="Logo"
              />
              <div class="welcome-text">
                <h1>How can I assist you today?</h1>
                <p>
                  Get instant answers about courses, admissions, campus
                  facilities, and student life at Sri Venkateswara University.
                </p>
              </div>
              <div class="suggestions-grid" id="trending-queries-container">
                <!-- Dynamic Content Loading... -->
              </div>
            </div>

            <!-- Messages will be appended here -->

            <!-- Typing Indicator -->
            <div
              id="typing-indicator"
              class="typing-indicator"
              style="display: none"
            >
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
            </div>
          </div>

          <!-- Floating Input Area -->
          <div class="input-area-wrapper">
            <div class="input-container">
              <!-- Trap for browser autofill -->
              <input
                type="text"
                style="
                  display: none;
                  opacity: 0;
                  height: 0;
                  width: 0;
                  position: absolute;
                "
                tabindex="-1"
              />
              <input
                type="password"
                style="
                  display: none;
                  opacity: 0;
                  height: 0;
                  width: 0;
                  position: absolute;
                "
                tabindex="-1"
              />

              <input
                type="text"
                id="user-input"
                placeholder="Ask anything... (Type or Speak)"
                autocomplete="off"
                name="chat-input-field"
              />
              <select
                id="lang-select"
                class="lang-select"
                title="Select Input/Output Language"
              >
                <option value="en">English</option>
                <option value="te">Telugu</option>
                <option value="hi">Hindi</option>
              </select>
              <button
                id="mic-btn"
                class="mic-btn"
                onclick="toggleVoiceInput()"
                title="Voice input"
              >
                <i class="fa-solid fa-microphone"></i>
              </button>
              <button
                id="send-btn"
                class="send-btn"
                onclick="sendMessage()"
                title="Send message"
              >
                <i class="fa-solid fa-arrow-up"></i>
              </button>
            </div>
          </div>
        </section>
