<section id="locations-section" class="content-section" style="display: none;">
          <div class="locations-container">
            <div class="header">
              <div style="display: flex; align-items: center; gap: 15px;">
                <div class="mobile-menu-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></div>
                <div>
                  <h2 class="locations-title" style="margin: 0;">
                    <i class="fa-solid fa-location-dot" style="margin-right: 12px; font-size: 0.9em; background: var(--gradient-primary); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;"></i>
                    University Locations
                  </h2>
                  <p class="locations-desc" style="margin: 0; font-size: 0.9rem;">
                    Select a facility or department to ask for location.
                  </p>
                </div>
              </div>
            </div>

              <!-- Search Box -->
              <div class="locations-search-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input 
                  type="text" 
                  id="locations-search" 
                  class="locations-search-input"
                  placeholder="Search for departments, blocks, or facilities..." 
                  oninput="filterLocations(this.value)"
                />
              </div>
            

            <div class="locations-card">
              <div class="locations-header">
                <div class="uni-name">Sri Venkateswara University</div>
                <div class="uni-sub">Tirupati, Andhra Pradesh</div>
              </div>

              <div class="locations-list" id="locations-list">
                <!-- populated by script -->
              </div>
            </div>
          </div>
        </section>
